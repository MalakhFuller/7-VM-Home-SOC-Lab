[suricata:json]

# Simple renames: top-level fields, straight alias
FIELDALIAS-src = src_ip AS src
FIELDALIAS-dest = dest_ip AS dest
FIELDALIAS-dvc = host AS dvc

# Nested fields: dotted source names must be single-quoted in EVAL
EVAL-signature = 'alert.signature'
EVAL-category = 'alert.category'
EVAL-signature_id = 'alert.signature_id'
EVAL-action = 'alert.action'
EVAL-severity_id = 'alert.severity'

# Severity: Suricata is numeric AND inverted; CIM wants words
EVAL-severity = case('alert.severity'=="1","high",'alert.severity'=="2","medium",'alert.severity'=="3","low")

# Transport: CIM wants it lowercase
EVAL-transport = lower(proto)

# Constants: stamp what produced this
EVAL-vendor_product = "Suricata"
EVAL-ids_type = "network"
